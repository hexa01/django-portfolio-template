# Nginx site template. Replace the three placeholders, then install it next to your other sites:
#   example.com           -> your domain (two places below, plus www.example.com)
#   /path/to/project      -> where the repo is cloned on the server (uploads are served from its media/ folder)
#   8055                  -> WEB_PORT from the server's .env, if you changed it
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/example.com
#   sudo ln -s /etc/nginx/sites-available/example.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d example.com -d www.example.com --redirect
# Certbot adds HTTPS to the installed file and renews the certificates itself. The installed file is the live one;
# this template is the starting point if the server is ever rebuilt.

# www -> bare domain
server {
    listen 80;
    listen [::]:80;
    server_name www.example.com;
    return 301 $scheme://example.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    client_max_body_size 6m;  # uploads are limited to 5 MB by the site
    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

    # uploads (images, diagrams, resume PDF), served straight from disk
    location /media/ {
        alias /path/to/project/media/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
        # uploaded files can never run scripts in the site's origin
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox";
    }

    location / {
        proxy_pass http://127.0.0.1:8055;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
